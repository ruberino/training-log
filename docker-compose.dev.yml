# Local dev sandbox only: runs `npm run dev` in a Linux container so the
# dev servers don't need the host's own 3000/5173. Not the production
# image; T13 adds the real Dockerfile/docker-compose.yml/Litestream setup.
#
# File-change events from the Windows host don't reliably reach either
# tsx's or Vite's watcher through the bind mount, so nothing hot-reloads:
# `docker compose -f docker-compose.dev.yml restart app` after any source
# change (client or server). Restarting is fast; node_modules persists in
# a named volume. Changing this file itself needs `up -d`, not `restart`,
# since `restart` keeps the existing container's environment.
services:
  app:
    image: node:22
    working_dir: /app
    # npm 12+ is required: npm ci with an older npm still runs node-gyp for
    # better-sqlite3 instead of using its bundled prebuild, and fails without
    # Python/a compiler. Skip reinstalling into the persisted node_modules
    # volume on every restart; run `npm ci` by hand after changing package.json.
    command: sh -c "npm install -g npm@12 && (test -d node_modules/fastify || npm ci); npm run dev"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      DEV_IN_CONTAINER: '1'
      # Sandbox-only values. Never reuse these outside a developer's own machine.
      APP_PASSWORD: dev-password-123
      SESSION_SECRET: dev-session-secret-change-me-please-32
      DATABASE_PATH: /app/data/training-log.db
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '28300:3000'
      - '28173:5173'

volumes:
  node_modules:
